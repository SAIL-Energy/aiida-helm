ghcrImagePullSecrets:
  name: "ghcr-secret"

ingress:
  host: "localhost"
  tlsEnabled: false

core:
  replicaCount: 1
  version: "latest"
  port: 8080
  path: "/aiida"
  streamerPollInterval: "30"

timescaledb:
  replicaCount: 1
  version: "latest-pg12"
  database: "aiida"
  encryptedUsername: ""
  encryptedPassword: ""
  port: 5432
  storageSize: "1Gi"

emqx:
  replicaCount: 1
  version: "latest"
  stdPort: 1883
  sslPort: 8883
  dashboardPort: 18083
  stdPortExt: 1883
  sslPortExt: 8883
  dashboardPortExt: 18083

teleinfo2mqtt:
  enabled: false
  replicaCount: 1
  version: "latest"
  serial: "/dev/tty4"
  mqttBaseTopic: "teleinfo"
  encryptedMqttUsername: ""
  encryptedMqttPassword: ""
  emitInterval: 2
  hassDiscovery: "false"
  ticMode: "history"
  timezone: "Europe/Paris"

keycloak:
  replicaCount: 1
  version: "latest"
  port: 8080
  managementPort: 9000
  path: "/auth"
  clientSecret: ""
  encryptedAdminUsername: ""
  encryptedAdminPassword: ""

