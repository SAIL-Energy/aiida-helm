apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nanomq-config
  {{- include "aiida.nanomq.labels" . | indent 2 }}
data:
  nanomq.conf: |-
    auth = {
      allow_anonymous = false
      no_match = deny
      deny_action = disconnect

      cache {
        max_size = 1024
        duration = 1m
      }

      http_auth = {
        auth_req {
          url = "{{ include "aiida.core.internal-host" . }}/mqtt-auth/auth"
          method = "POST"
          headers.content-type = "application/x-www-form-urlencoded"
          params = {username = "%u", password = "%P"}
        }

        super_req {
          url = "{{ include "aiida.core.internal-host" . }}/mqtt-auth/superuser"
          method = "POST"
          headers.content-type = "application/x-www-form-urlencoded"
          params = {username = "%u", password = "%P"}
        }

        acl_req {
          url = "{{ include "aiida.core.internal-host" . }}/mqtt-auth/acl"
          method = "POST"
          headers.content-type = "application/x-www-form-urlencoded"
          params = {username = "%u", password = "%P", action = "%A" topic = "%t"}
        }

        timeout = 5s
        connect_timeout = 5s
        pool_size = 32
      }
    }

    log = {
      to = [console]
      level = "info"
      rotation = {
        size = "10MB"
        count = 5
      }
    }

    webhook = {
      url = "{{ include "aiida.core.internal-host" . }}/webhook/event"
      headers.content-type = "application/json"
      pool_size = 32
      events = [
        {
          event = "on_client_connack"
        }
        {
          event = "on_client_disconnected"
        }
      ]
    }