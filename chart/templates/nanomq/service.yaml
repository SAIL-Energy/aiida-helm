apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nanomq
  {{- include "aiida.nanomq.labels" . | indent 2 }}
spec:
  type: LoadBalancer
  selector:
    app: {{ .Release.Name }}-nanomq
  ports:
    - name: mqtt-std
      port: {{ .Values.nanomq.stdPortExt }}
      targetPort: mqtt-std
    - name: mqtt-ssl
      port: {{ .Values.nanomq.sslPortExt }}
      targetPort: mqtt-ssl
    - name: mqtt-ws
      port: {{ .Values.nanomq.wsPortExt }}
      targetPort: mqtt-ws