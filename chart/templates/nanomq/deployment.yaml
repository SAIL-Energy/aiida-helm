apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nanomq
  {{- include "aiida.nanomq.labels" . | indent 2 }}
spec:
  replicas: {{ .Values.nanomq.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-nanomq
  template:
    metadata:
    {{- include "aiida.nanomq.labels" . | indent 6 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/nanomq/secret.yaml") . | sha256sum }}
        checksum/configmap: {{ include (print $.Template.BasePath "/nanomq/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: nanomq
          image: "emqx/nanomq:{{ .Values.nanomq.version }}"
          ports:
            - name: mqtt-std
              containerPort: {{ .Values.nanomq.stdPort }}
              protocol: TCP
            - name: mqtt-ssl
              containerPort: {{ .Values.nanomq.sslPort }}
              protocol: TCP
            - name: mqtt-ws
              containerPort: {{ .Values.nanomq.wsPort }}
              protocol: TCP
          env:
            - name: NANOMQ_HTTP_SERVER_ENABLED
              value: "true"
          volumeMounts:
            - name: nanomq-config
              mountPath: /etc/nanomq.conf
              subPath: nanomq.conf
            - name: nanomq-secret
              mountPath: /etc/nanomq_pwd.conf
              subPath: pwd
          readinessProbe:
            tcpSocket:
              port: mqtt-std

      volumes:
        - name: nanomq-config
          configMap:
            name: {{ .Release.Name }}-nanomq-config
        - name: nanomq-secret
          secret:
            secretName: {{ .Release.Name }}-nanomq-secret
