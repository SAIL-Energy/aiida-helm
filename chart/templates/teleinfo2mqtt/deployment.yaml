{{- if .Values.teleinfo2mqtt.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-teleinfo2mqtt
  {{- include "aiida.teleinfo2mqtt.labels" . | indent 2 }}
spec:
  replicas: {{ .Values.teleinfo2mqtt.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-teleinfo2mqtt
  template:
    metadata:
    {{- include "aiida.teleinfo2mqtt.labels" . | indent 6 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/teleinfo2mqtt/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: teleinfo2mqtt
          image: "fmartinou/teleinfo2mqtt:{{ .Values.teleinfo2mqtt.version }}"
          env:
            - name: MQTT_BASE_TOPIC
              value: {{ .Values.teleinfo2mqtt.mqttBaseTopic }}
            - name: MQTT_URL
              value: "mqtt://{{ .Release.Name }}-emqx:{{ .Values.emqx.stdPort }}"
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-teleinfo2mqtt-secret
                  key: mqttUsername
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-teleinfo2mqtt-secret
                  key: mqttPassword
            - name: EMIT_INTERVAL
              value: "{{ .Values.teleinfo2mqtt.emitInterval }}"
            - name: HASS_DISCOVERY
              value: "{{ .Values.teleinfo2mqtt.hassDiscovery }}"
            - name: SERIAL
              value: "{{ .Values.teleinfo2mqtt.serial }}"
            - name: TIC_MODE
              value: "{{ .Values.teleinfo2mqtt.ticMode }}"
            - name: TIMEZONE
              value: "{{ .Values.teleinfo2mqtt.timezone }}"
          volumeMounts:
            - name: serial
              mountPath: {{ .Values.teleinfo2mqtt.serial }}

      volumes:
        - name: serial
          hostPath:
            path: {{ .Values.teleinfo2mqtt.serial }}
{{- end -}}