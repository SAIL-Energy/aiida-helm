apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Release.Name }}-teleinfo2mqtt-secret
spec:
  encryptedData:
    mqttUsername: {{ .Values.teleinfo2mqtt.encryptedMqttUsername }}
    mqttPassword: {{ .Values.teleinfo2mqtt.encryptedMqttPassword }}
  template:
    metadata:
      name: {{ .Release.Name }}-teleinfo2mqtt-secret
      labels:
      {{- include "aiida.labels" . | indent 6 }}
    type: Opaque