apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Release.Name }}-core-secret
spec:
  encryptedData:
    installerToken: {{ .Values.core.encryptedInstallerToken }}
  template:
    metadata:
      name: {{ .Release.Name }}-core-secret
      labels:
      {{- include "aiida.labels" . | indent 6 }}
    type: Opaque