{{- if not .Values.core.keystore.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aiida.core.keystore-secret-name" . }}
  {{- include "aiida.core.labels" . | nindent 2 }}
  {{- if .Values.core.persistence.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  {{ .Values.core.keystore.existingSecretKey | quote }}: {{ required "core.keystore.password or core.keystore.existingSecret is required" .Values.core.keystore.password | quote }}
{{- end }}
