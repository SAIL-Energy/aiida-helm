apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-realm-config
  {{- include "aiida.keycloak.labels" . | indent 2 }}
data:
  EDDIE-realm.json: |-
    {
      "realm": "EDDIE",
      "enabled": true,
      "loginTheme": "eddie-theme",
      "defaultRoles": ["manage-account"],
      "clients": [
        {
          "clientId": "AIIDA",
          "enabled": true,
          "redirectUris": ["*"],
          "publicClient": false,
          "secret": "{{ .Values.keycloak.clientSecret }}",
          "directAccessGrantsEnabled": true
        }
      ],
      "groups": [
        {
          "name": "aiida-user-group",
          "path": "/aiida-user-group",
          "clientRoles": {
            "account": [
              "manage-account"
            ]
          }
        }
      ],
      "defaultGroups": [
        "/aiida-user-group"
      ],
      "users": [
        {
          "username": "aiida",
          "email": "aiida@eddie.eu",
          "firstName": "John",
          "lastName": "Doe",
          "enabled": true,
          "groups": ["/aiida-user-group"],
          "credentials": [
            {
              "type": "password",
              "value": "aiida"
            }
          ]
        }
      ]
    }