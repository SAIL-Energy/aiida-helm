{{- if and .Values.timescaledb.backup.enabled (not .Values.timescaledb.backup.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aiida.timescaledb.backup-secret-name" . }}
  {{- include "aiida.timescaledb.labels" . | nindent 2 }}
type: Opaque
stringData:
  {{ .Values.timescaledb.backup.s3.existingSecretKeys.accessKey | quote }}: {{ .Values.timescaledb.backup.s3.accessKey | quote }}
  {{ .Values.timescaledb.backup.s3.existingSecretKeys.secretKey | quote }}: {{ .Values.timescaledb.backup.s3.secretKey | quote }}
{{- end }}
