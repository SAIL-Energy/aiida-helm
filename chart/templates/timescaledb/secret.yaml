{{- if not .Values.timescaledb.existingSecret }}
apiVersion: v1
metadata:
  name: {{ include "aiida.timescaledb.secret-name" . }}
  {{- include "aiida.timescaledb.labels" . | nindent 2 }}
kind: Secret
type: Opaque
stringData:
  {{ .Values.timescaledb.existingSecretKeys.password | quote }}: {{ .Values.timescaledb.password | quote }}
  {{ .Values.timescaledb.existingSecretKeys.username | quote }}: {{ .Values.timescaledb.username | quote }}
{{- end }}
