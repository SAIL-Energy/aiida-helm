apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-timescaledb
  {{- include "aiida.timescaledb.labels" . | indent 2 }}
spec:
  replicas: {{ .Values.timescaledb.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-timescaledb
  template:
    metadata:
    {{- include "aiida.timescaledb.labels" . | indent 6 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/timescaledb/secret.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: timescaledb
          image: "timescale/timescaledb:{{ .Values.timescaledb.version }}"
          ports:
            - name: timescaledb
              containerPort: {{ .Values.timescaledb.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.timescaledb.database }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-timescaledb-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-timescaledb-secret
                  key: password
          volumeMounts:
            - name: timescaledb-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            tcpSocket:
              port: timescaledb

  volumeClaimTemplates:
    - metadata:
        name: timescaledb-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.timescaledb.storageSize }}