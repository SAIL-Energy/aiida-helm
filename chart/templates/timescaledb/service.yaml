apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-timescaledb
  {{- include "aiida.timescaledb.labels" . | indent 2 }}
spec:
  selector:
    app: {{ .Release.Name }}-timescaledb
  ports:
    - name: timescaledb
      port: {{ .Values.timescaledb.port }}
      targetPort: timescaledb