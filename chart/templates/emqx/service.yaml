apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-emqx
  {{- include "aiida.emqx.labels" . | indent 2 }}
spec:
  type: LoadBalancer
  selector:
    app: {{ .Release.Name }}-emqx
  ports:
    - name: mqtt-std
      port: {{ .Values.emqx.stdPortExt }}
      targetPort: mqtt-std
    - name: mqtt-ssl
      port: {{ .Values.emqx.sslPortExt }}
      targetPort: mqtt-ssl
    - name: mqtt-ws
      port: {{ .Values.emqx.dashboardPortExt }}
      targetPort: mqtt-dashboard