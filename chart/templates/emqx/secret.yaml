apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Release.Name }}-emqx-secret
spec:
  encryptedData:
    superuserPassword: {{ .Values.emqx.encryptedSuperuserPassword }}
    databasePassword: {{ .Values.emqx.encryptedDatabasePassword }}
  template:
    metadata:
      name: {{ .Release.Name }}-emqx-secret
      labels:
      {{- include "aiida.labels" . | indent 6 }}
    type: Opaque