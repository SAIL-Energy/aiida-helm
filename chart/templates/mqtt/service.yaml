{{- $broker := include "aiida.mqtt.broker" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiida.mqtt.service-name" . }}
  {{- include "aiida.mqtt.labels" . | nindent 2 }}
spec:
  selector:
    app: {{ include (printf "aiida.%s.name" $broker) . }}
  ports:
    - name: mqtt
      port: 1883
      protocol: TCP
      targetPort: mqtt
    {{- if eq (include "aiida.mqtt.tls-enabled" .) "true" }}
    - name: mqttssl
      port: 8883
      protocol: TCP
      targetPort: mqttssl
    {{- end }}
