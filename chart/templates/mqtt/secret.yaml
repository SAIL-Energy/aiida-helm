{{- if not .Values.mqtt.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aiida.mqtt.secret-name" . }}
  {{- include "aiida.mqtt.labels" . | nindent 2 }}
type: Opaque
stringData:
  {{ .Values.mqtt.existingSecretKeys.superuserPassword | quote }}: {{ .Values.mqtt.superuserPassword | quote }}
  {{ .Values.mqtt.existingSecretKeys.databasePassword | quote }}: {{ .Values.mqtt.db.password | quote }}
{{- end }}
