ghcrImagePullSecrets:
  name: "ghcr-secret"

core:
  replicaCount: 1
  version: "latest"
  port: 8010
  repositoryTrack: "stable"

service:
  namespace: "aiida-services"

aiida:

secrets:
  core:
    encryptedInstallerToken: "admin"
  timescaledb:
    encryptedUsername: "admin"
    encryptedPassword: "admin"
  nanomq:
    encryptedPwd: "admin:admin"
  teleinfo2mqtt:
    encryptedMqttUsername: "*"
    encryptedMqttPassword: "*"
  keycloak:
    encryptedAdminUsername: "admin"
    encryptedAdminPassword: "admin"