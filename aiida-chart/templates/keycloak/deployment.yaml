apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-keycloak
  {{- include "aiida.keycloak.labels" . | indent 2 }}
spec:
  replicas: {{ .Values.keycloak.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-keycloak
  template:
    metadata:
    {{- include "aiida.keycloak.labels" . | indent 6 }}
    spec:
      containers:
        - name: keycloak
          image: "quay.io/keycloak/keycloak:{{ .Values.keycloak.version }}"
          args:
            - -v
            - start-dev
            - --import-realm
          ports:
            - name: keycloak
              containerPort: {{ .Values.keycloak.port }}
          env:
            - name: KC_HOSTNAME
              value: "{{ .Values.keycloak.externalHost }}"
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-keycloak-secret
                  key: adminUsername
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-keycloak-secret
                  key: adminPassword
          volumeMounts:
            - name: keycloak-realm-config
              mountPath: /opt/keycloak/data/import/
            - name: keycloak-theme-config
              mountPath: /opt/keycloak/themes/eddie-theme/

      volumes:
        - name: keycloak-realm-config
          configMap:
            name: {{ .Release.Name }}-keycloak-realm-config
        - name: keycloak-theme-config
          configMap:
            name: {{ .Release.Name }}-keycloak-theme-config
            items:
              - key: theme.properties
                path: login/theme.properties
              - key: styles.css
                path: login/resources/css/styles.css
              - key: eddie.svg
                path: login/resources/images/eddie.svg
