apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nanomq
  {{- include "aiida.nanomq.labels" . | indent 2 }}
spec:
  replicas: {{ .Values.nanomq.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-nanomq
  template:
    metadata:
    {{- include "aiida.nanomq.labels" . | indent 6 }}
    spec:
      containers:
        - name: nanomq
          image: "emqx/nanomq:{{ .Values.nanomq.version }}"
          ports:
            - name: mqttstd
              containerPort: {{ .Values.nanomq.stdPort }}
              protocol: TCP
            - name: mqttssl
              containerPort: {{ .Values.nanomq.sslPort }}
              protocol: TCP
            - name: mqttws
              containerPort: {{ .Values.nanomq.wsPort }}
              protocol: TCP
          volumeMounts:
            - name: nanomq-config
              mountPath: /etc/nanomq.conf
              subPath: nanomq.conf
            - name: nanomq-secret
              mountPath: /etc/nanomq_pwd.conf
              subPath: pwd

      volumes:
        - name: nanomq-config
          configMap:
            name: {{ .Release.Name }}-nanomq-config
        - name: nanomq-secret
          secret:
            secretName: {{ .Release.Name }}-nanomq-secret
