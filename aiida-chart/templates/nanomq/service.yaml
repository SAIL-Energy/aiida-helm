apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nanomq
  {{- include "aiida.nanomq.labels" . | indent 2 }}
spec:
  selector:
    app: {{ .Release.Name }}-nanomq
  ports:
    - name: mqtt-std
      port: {{ .Values.nanomq.stdPort }}
      targetPort: mqtt-std
    - name: mqtt-ssl
      port: {{ .Values.nanomq.sslPort }}
      targetPort: mqtt-ssl
    - name: mqtt-ws
      port: {{ .Values.nanomq.wsPort }}
      targetPort: mqtt-ws