{{- if eq .Values.ingress.tlsEnabled "true" -}}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Release.Name }}-cluster-issuer
spec:
  acme:
    email: developers@eddie.energy
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: {{ .Release.Name }}-cluster-issuer
    solvers:
      - http01:
          ingress:
            class: traefik
{{- end -}}