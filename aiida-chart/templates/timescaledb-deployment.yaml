apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-timescaledb
  {{- include "aiida.timescaledb.labels" . | indent 2 }}
spec:
  replicas: {{ .Values.timescaledb.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-timescaledb
  template:
    metadata:
    {{- include "aiida.timescaledb.labels" . | indent 6 }}
    spec:
      containers:
      - name: timescaledb
        image: "timescale/timescaledb:{{ .Values.timescaledb.version }}"
        ports:
        - containerPort: {{ .Values.timescaledb.port }}
        env:
        - name: POSTGRES_DB
          value: {{ .Values.timescaledb.database }}
        - name: POSTGRES_USER
          value: {{ .Values.timescaledb.postgresUser }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.timescaledb.postgresPassword }}
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: timescaledb-data
      volumes:
      - name: timescaledb-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-timescaledb-pvc