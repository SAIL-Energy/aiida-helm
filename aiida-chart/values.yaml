ghcrImagePullSecrets:
  name: "ghcr-secret"

ingress:
  host: "localhost"
  tls:
    enabled: "false"
    clusterIssuer: ""

timescaledb:
  replicaCount: 1
  version: "latest-pg12"
  database: "aiida"
  encryptedUsername: ""
  encryptedPassword: ""
  port: 5432
  storageSize: "1Gi"

nanomq:
  replicaCount: 1
  version: "latest"
  encryptedPwd: ""
  stdPort: 1883
  sslPort: 8883
  wsPort: 8083

teleinfo2mqtt:
  enabled: "false"
  replicaCount: 1
  version: "latest"
  serial: "/dev/tty4"
  mqttBaseTopic: "teleinfo"
  encryptedMqttUsername: ""
  encryptedMqttPassword: ""
  emitInterval: 2
  hassDiscovery: "false"
  ticMode: "history"
  timezone: "Europe/Paris"

keycloak:
  replicaCount: 1
  version: "latest"
  port: 8080
  internalHost: "http://localhost:8080"
  externalHost: "http://localhost/auth"
  encryptedAdminUsername: ""
  encryptedAdminPassword: ""

